apps:
  # =====================================================
  # THREAD 1: Khám phá link truyện từ dtruyen.com
  # Chạy liên tục, sau mỗi lần kết thúc sẽ tự khởi động lại
  # Sleep 20-40s giữa các request (xem CrawlDtruyenCommand.php)
  # =====================================================
  - name: crawler-thread1-discovery
    script: artisan
    interpreter: php
    args: "crawl:dtruyen"
    cwd: /var/www/read-app/spy-doctruyen
    autorestart: true
    watch: false
    max_restarts: 99999
    restart_delay: 5000 # Đợi 5s trước khi restart sau khi command kết thúc
    log_date_format: "YYYY-MM-DD HH:mm:ss"
    out_file: /var/www/read-app/spy-doctruyen/storage/logs/pm2-thread1-out.log
    error_file: /var/www/read-app/spy-doctruyen/storage/logs/pm2-thread1-err.log
    env:
      APP_ENV: production

  # =====================================================
  # THREAD 2 - Bước 2a: Dispatch Jobs truyện vào Queue
  # Chạy mỗi 5 phút một lần để dispatch các story mới
  # =====================================================
  - name: crawler-thread2-dispatcher
    script: artisan
    interpreter: php
    args: "crawl:dispatch-stories --limit=20"
    cwd: /var/www/read-app/spy-doctruyen
    autorestart: true
    watch: false
    max_restarts: 99999
    restart_delay: 300000 # Đợi 5 phút (300s) trước khi chạy tiếp
    log_date_format: "YYYY-MM-DD HH:mm:ss"
    out_file: /var/www/read-app/spy-doctruyen/storage/logs/pm2-thread2-dispatcher-out.log
    error_file: /var/www/read-app/spy-doctruyen/storage/logs/pm2-thread2-dispatcher-err.log
    env:
      APP_ENV: production

  # =====================================================
  # THREAD 2 - Bước 2b: Queue Worker xử lý Jobs
  # Chạy liên tục, xử lý stories queue và chapters queue
  # Sleep 20-40s trong từng Job (xem ProcessDtruyenStoryJob.php)
  # =====================================================
  - name: crawler-thread2-worker
    script: artisan
    interpreter: php
    args: "queue:work --queue=chapters,stories --timeout=300 --sleep=30 --tries=3"
    cwd: /var/www/read-app/spy-doctruyen
    autorestart: true
    watch: false
    max_restarts: 99999
    restart_delay: 3000
    log_date_format: "YYYY-MM-DD HH:mm:ss"
    out_file: /var/www/read-app/spy-doctruyen/storage/logs/pm2-thread2-worker-out.log
    error_file: /var/www/read-app/spy-doctruyen/storage/logs/pm2-thread2-worker-err.log
    env:
      APP_ENV: production
